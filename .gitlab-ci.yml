# InternMatch — Finalized CI/CD Pipeline
# Branch strategy:
#   dev       → lint + unit test + build check (fast feedback)
#   pre-prod  → e2e smoke (M1) auto + full manual
#   main      → deploy to Vercel production
#
# Required GitLab CI/CD Variables (Settings > CI/CD > Variables, masked):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET, GEMINI_API_KEY,
#   EMAIL_USER, EMAIL_PASS,
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Vercel env must be configured in Vercel dashboard as well — `vercel pull` syncs it.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection


stages:
  - lint
  - test
  - build
  - e2e
  - deploy
  - secret-detection

variables:
  NODE_OPTIONS: "--max-old-space-size=4096"
  PLAYWRIGHT_BROWSERS_PATH: "0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - front/package-lock.json
      - e2e/package-lock.json
  paths:
    - .npm/
    - front/node_modules/
    - e2e/node_modules/
  policy: pull-push

# ==========================================
# LINT — front (dev / pre-prod / main)
# non-blocking so legacy warnings don't block deploy
# ==========================================
lint:front:
  stage: lint
  image: node:22-alpine
  script:
    - cd front
    - npm ci --cache ../.npm --prefer-offline
    - npm run lint || echo "lint warnings present — check logs"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "pre-prod" || $CI_COMMIT_BRANCH == "main"'
  allow_failure: true
  cache:
    key:
      files:
        - front/package-lock.json
    paths:
      - .npm/
      - front/node_modules/
    policy: pull-push

# ==========================================
# DEV — Unit Tests (jest in front/)
# ==========================================
unit_test:
  stage: test
  image: node:22-alpine
  script:
    - echo "Running unit tests (front/jest)..."
    - cd front
    - npm ci --cache ../.npm --prefer-offline
    - npm test -- --ci --coverage=false
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "pre-prod" || $CI_COMMIT_BRANCH == "main"'

# ==========================================
# BUILD CHECK — verify Next.js compiles
# Runs on all branches to catch build breakage before merge
# ==========================================
build:front:
  stage: build
  image: node:22-alpine
  needs: ["unit_test"]
  before_script:
    # Inject env from CI variables; fallback to dummy so `next build` can still
    # compile in forks/MRs without secrets. Vercel deploy uses real env via `vercel pull`.
    - cd front
    - |
      if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
        echo "WARNING: CI variables missing — using dummy env for build check only"
        cat > .env <<EOF
      NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=dummy_anon_key_for_ci_build_check
      SUPABASE_SERVICE_ROLE_KEY=dummy_service_role_key_for_ci_build_check
      JWT_SECRET=dummy_jwt_secret_for_ci_build_check_32chars!!
      GEMINI_API_KEY=dummy_gemini_key
      EMAIL_USER=ci@example.com
      EMAIL_PASS=dummy
      EOF
      else
        cat > .env <<EOF
      NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
      JWT_SECRET=$JWT_SECRET
      GEMINI_API_KEY=$GEMINI_API_KEY
      EMAIL_USER=$EMAIL_USER
      EMAIL_PASS=$EMAIL_PASS
      EOF
      fi
    - cat .env | sed 's/=.*/=***/'
  script:
    - npm ci --cache ../.npm --prefer-offline
    - npm run build
  after_script:
    - rm -f .env
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "pre-prod" || $CI_COMMIT_BRANCH == "main"'
  cache:
    key:
      files:
        - front/package-lock.json
    paths:
      - .npm/
      - front/node_modules/
      - front/.next/cache/
    policy: pull-push

# ==========================================
# PRE-PROD — E2E Smoke (Module-1 only, chromium, auto)
# Fast gate: ~2-3 min vs 20 min for full suite
# ==========================================
e2e:smoke:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.61.1-jammy
  needs: ["build:front"]
  variables:
    CI: "true"
  before_script:
    - cd front && npm ci --cache ../.npm --prefer-offline && cd ../e2e && npm ci --cache ../.npm --prefer-offline && cd ..
    - |
      if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
        echo "WARNING: Supabase env missing — smoke will run with dummy env"
        cat > front/.env <<EOF
      NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=dummy_anon_key_for_ci_build_check
      SUPABASE_SERVICE_ROLE_KEY=dummy_service_role_key_for_ci_build_check
      JWT_SECRET=dummy_jwt_secret_for_ci_build_check_32chars!!
      GEMINI_API_KEY=dummy_gemini_key
      EMAIL_USER=ci@example.com
      EMAIL_PASS=dummy
      EOF
      else
        cat > front/.env <<EOF
      NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
      JWT_SECRET=$JWT_SECRET
      GEMINI_API_KEY=$GEMINI_API_KEY
      EMAIL_USER=$EMAIL_USER
      EMAIL_PASS=$EMAIL_PASS
      EOF
      fi
    - npx --prefix e2e playwright install --with-deps chromium
  script:
    - echo "Running E2E smoke — Module-1 (chromium only)..."
    - cd e2e
    - npx playwright test tests/Module-1.spec.ts --project=chromium --reporter=html
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 1 week
  after_script:
    - rm -f front/.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-prod"'
  retry:
    max: 1
    when:
      - script_failure

# ==========================================
# PRE-PROD — E2E Full (all 7 modules, chromium, manual)
# Run before merging pre-prod → main. allow_failure so it doesn't block pipeline if flaky.
# ==========================================
e2e:full:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.61.1-jammy
  needs: ["build:front"]
  variables:
    CI: "true"
  before_script:
    - cd front && npm ci --cache ../.npm --prefer-offline && cd ../e2e && npm ci --cache ../.npm --prefer-offline && cd ..
    - |
      if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
        echo "WARNING: Supabase env missing — full E2E will run with dummy env"
        cat > front/.env <<EOF
      NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=dummy_anon_key_for_ci_build_check
      SUPABASE_SERVICE_ROLE_KEY=dummy_service_role_key_for_ci_build_check
      JWT_SECRET=dummy_jwt_secret_for_ci_build_check_32chars!!
      GEMINI_API_KEY=dummy_gemini_key
      EMAIL_USER=ci@example.com
      EMAIL_PASS=dummy
      EOF
      else
        cat > front/.env <<EOF
      NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
      JWT_SECRET=$JWT_SECRET
      GEMINI_API_KEY=$GEMINI_API_KEY
      EMAIL_USER=$EMAIL_USER
      EMAIL_PASS=$EMAIL_PASS
      EOF
      fi
    - npx --prefix e2e playwright install --with-deps chromium
  script:
    - echo "Running E2E full regression — all modules (chromium only)..."
    - cd e2e
    - npx playwright test --project=chromium --reporter=html
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 1 week
  after_script:
    - rm -f front/.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-prod"'
      when: manual
      allow_failure: true
  retry:
    max: 1
    when:
      - script_failure
  timeout: 45m

# ==========================================
# MAIN — Deploy Frontend to Vercel
# front/ is full-stack: Next.js + Supabase (Server Actions / API Routes)
# back/ is archived — see back/README.md (no deploy)
# ==========================================
deploy_frontend:
  stage: deploy
  image: node:22-alpine
  needs: ["build:front"]
  before_script:
    - apk add --no-cache git
    - npm i -g vercel@latest
    - vercel --version
    - |
      if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
        echo "ERROR: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID must be set in GitLab CI/CD Variables"
        exit 1
      fi
  script:
    - cd front
    - echo "Pulling Vercel env (production)..."
    - vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
    - echo "Building on Vercel infrastructure..."
    - vercel build --prod --token "$VERCEL_TOKEN"
    - echo "Deploying to Vercel production..."
    - vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
  environment:
    name: production
    url: https://internmatch.vercel.app
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  resource_group: production

# Security jobs (from templates) — keep enabled for all branches

