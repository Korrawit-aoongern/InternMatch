# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - pre-build
  - build
  - test
  - merge
  - deploy
  - secret-detection
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
  GIT_DEPTH: "0"
  FRONTEND_IMAGE: "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}"
secret_detection:
  stage: secret-detection

workflow:
  rules:
    - if: '$DEPLOY_ONLY == "true"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "pre-prod"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

# ==========================================
# STAGE: PRE-BUILD (dev only)
# ==========================================
lint_and_unit_test:
  stage: pre-build
  image: node:20.19.0-alpine3.20
  script:
    - echo "Installing root & workspace dependencies..."
    - npm i
    - npm ci

    - echo "Running linting across all workspaces..."
    - npm run lint --workspaces

    - echo "Running backend tests..."
    - npm run test --workspace=back

    - echo "Building frontend app to verify production build..."
    - npm run build --workspace=front

  rules:
    - if: '$DEPLOY_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'

# ==========================================
# STAGE: BUILD (dev only - Frontend Docker Image)
# ==========================================
build_artifacts:
  stage: build
  image: docker:27.1.1
  services:
    - name: docker:27.1.1-dind
  script:
    - echo "Logging into GitLab Container Registry..."
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    
    - echo "Building frontend image..."
    - docker build -f frontend/Dockerfile -t "$FRONTEND_IMAGE" ./frontend
    
    - echo "Pushing frontend image to Registry..."
    - docker push "$FRONTEND_IMAGE"
    
    - mkdir -p artifacts
    - echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" > artifacts/image-tags.env
  artifacts:
    paths:
      - artifacts/image-tags.env
    expire_in: 1 week
  rules:
    - if: '$DEPLOY_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'

# ==========================================
# STAGE: TEST (pre-prod only)
# ==========================================
e2e_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.50.0-jammy
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  script:
    - echo "Running Playwright E2E tests..."
    - cd e2e
    - npm ci
    - npx playwright install --with-deps
    - npx playwright test
  rules:
    - if: '$DEPLOY_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "pre-prod"'

# ==========================================
# STAGE: MERGE (Draft MR via API)
# ==========================================
promote_to_preprod:
  stage: merge
  image: curlimages/curl:8.10.1
  allow_failure: false
  script:
    - echo "Creating Draft MR from dev -> pre-prod..."
    - |
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{\"source_branch\":\"dev\",\"target_branch\":\"pre-prod\",\"title\":\"Draft: Promote dev to pre-prod (${CI_COMMIT_SHORT_SHA})\",\"remove_source_branch\":false,\"squash\":false}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
  rules:
    - if: '$DEPLOY_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'

promote_to_main:
  stage: merge
  image: curlimages/curl:8.10.1
  allow_failure: false
  script:
    - echo "Creating Draft MR from pre-prod -> main..."
    - |
      curl --fail --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{\"source_branch\":\"pre-prod\",\"target_branch\":\"main\",\"title\":\"Draft: Promote pre-prod to main (${CI_COMMIT_SHORT_SHA})\",\"remove_source_branch\":false,\"squash\":false}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"
  rules:
    - if: '$DEPLOY_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "pre-prod"'

# ==========================================
# STAGE: DEPLOY (main only)
# ==========================================
deploy_preflight:
  stage: deploy
  image: alpine:3.20
  script:
    - |
      missing=0
      # ตรวจสอบตัวแปรสำหรับ Vercel และ Cloudflare (CLOUDFLARE_API_TOKEN)
      for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID CLOUDFLARE_API_TOKEN; do
        if [ -z "$(eval echo \$$var)" ]; then
          echo "Missing $var"
          missing=1
        fi
      done
      if [ "$missing" -ne 0 ]; then
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_frontend_vercel:
  stage: deploy
  image: node:20.19.0-alpine3.20
  needs:
    - deploy_preflight
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
    - npx vercel build --prod --token "$VERCEL_TOKEN"
    - npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_backend_cloudflare:
  stage: deploy
  image: node:20.19.0-alpine3.20
  needs:
    - deploy_preflight
  script:
    - echo "Deploying backend to Cloudflare Workers..."
    - cd backend
    - npm ci
    # ใช้ wrangler ในการ deploy ไปยัง Cloudflare
    # แนะนำให้มีไฟล์ wrangler.toml หรือ wrangler.json อยู่ในโฟลเดอร์ backend
    - CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" npx wrangler deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
