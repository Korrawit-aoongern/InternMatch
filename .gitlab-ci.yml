# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - test
  - deploy
  - secret-detection
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection

# ==========================================
# DEV — Unit Test
# ==========================================

unit_test:
  stage: test
  image: node:22-alpine

  script:
    - echo "Running unit tests..."
    - echo "TODO`:` Add real unit tests later"
    - echo "Unit tests passed!"

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'


# ==========================================
# PRE-PROD — E2E Test
# ==========================================

e2e_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.50.0-jammy

  script:
    - echo "Installing E2E dependencies..."
    - cd e2e
    - npm ci

    - echo "Running E2E tests..."
    - npx playwright test

  rules:
    - if: '$CI_COMMIT_BRANCH == "pre-prod"'


# ==========================================
# MAIN — Deploy Frontend (front/ is full-stack: Next.js + Supabase)
# NOTE: Backend lives inside front/ via Server Actions / API Routes.
#       back/ is archived dead code — see back/README.md
# ==========================================

deploy_frontend:
  stage: deploy
  image: node:20-alpine

  script:
    - cd front
    - npm ci
    - npm run build

    - echo "Deploying frontend to Vercel..."
    - npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
    - npx vercel build --prod --token "$VERCEL_TOKEN"
    - npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ==========================================
# MAIN — Deploy Backend — ARCHIVED
# ==========================================
# back/ is a dormant Express scaffold (src/app.ts Hello World only).
# It is NOT deployed. The real backend is inside front/.
# This job is kept as manual + allow_failure so old pipelines referencing
# it don't break, but it does nothing. Delete this block when ready
# to fully remove back/.
deploy_backend:
  stage: deploy
  image: node:20-alpine

  script:
    - echo "back/ is archived — skipping backend deploy. See back/README.md"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
